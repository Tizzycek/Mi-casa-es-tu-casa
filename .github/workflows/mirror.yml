name: Mirror to GitLab

on:
  push:
    branches: [ main, master ]
    tags: '*'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Push to GitLab (HTTPS)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_HTTPS_TOKEN }}
        run: |
          # Configura git per usare il token
          git remote add gitlab https://oauth2:$GITLAB_TOKEN@gitlab.di.unipmn.it/mi-casa-es-tu-casa.git
          
          # Push di tutto
          git push --mirror gitlab